<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" fill="none">
  <!-- Zakim Bridge -->
  <g stroke="currentColor" stroke-width="3" opacity="0.9">
    <line x1="60" y1="500" x2="60" y2="150"/>
    <line x1="130" y1="500" x2="130" y2="150"/>
    <line x1="60" y1="150" x2="130" y2="150"/>
    <line x1="60" y1="180" x2="10" y2="380"/>
    <line x1="60" y1="220" x2="10" y2="380"/>
    <line x1="60" y1="260" x2="10" y2="380"/>
    <line x1="60" y1="300" x2="10" y2="380"/>
    <line x1="130" y1="180" x2="185" y2="380"/>
    <line x1="130" y1="220" x2="185" y2="380"/>
    <line x1="130" y1="260" x2="185" y2="380"/>
    <line x1="130" y1="300" x2="185" y2="380"/>
    <line x1="60" y1="180" x2="0" y2="180"/>
    <line x1="130" y1="180" x2="195" y2="180"/>
  </g>

  <!-- generic low buildings -->
  <g fill="currentColor" opacity="0.55">
    <rect x="220" y="360" width="40" height="140"/>
    <rect x="266" y="330" width="34" height="170"/>
    <rect x="306" y="380" width="46" height="120"/>
    <rect x="900" y="340" width="38" height="160"/>
    <rect x="944" y="300" width="30" height="200"/>
    <rect x="980" y="370" width="42" height="130"/>
    <rect x="1300" y="350" width="36" height="150"/>
    <rect x="1342" y="310" width="30" height="190"/>
    <rect x="1380" y="380" width="44" height="120"/>
    <rect x="1430" y="340" width="32" height="160"/>
  </g>

  <!-- Custom House Tower -->
  <g fill="currentColor" opacity="0.65">
    <rect x="360" y="260" width="34" height="240"/>
    <polygon points="360,260 394,260 377,220"/>
  </g>

  <!-- Prudential Tower -->
  <g fill="currentColor" opacity="0.75">
    <rect x="440" y="150" width="80" height="350"/>
    <rect x="460" y="120" width="40" height="35"/>
  </g>

  <!-- 111 Huntington ("R2D2") -->
  <g fill="currentColor" opacity="0.6">
    <rect x="540" y="220" width="60" height="280"/>
    <ellipse cx="570" cy="220" rx="30" ry="18"/>
  </g>

  <!-- John Hancock Tower (parallelogram glass slab) -->
  <g fill="currentColor" opacity="0.85">
    <polygon points="660,60 760,60 745,500 645,500"/>
  </g>

  <!-- Mid buildings -->
  <g fill="currentColor" opacity="0.5">
    <rect x="790" y="330" width="40" height="170"/>
    <rect x="836" y="290" width="30" height="210"/>
  </g>

  <!-- State Street / financial district cluster -->
  <g fill="currentColor" opacity="0.6">
    <rect x="1040" y="260" width="50" height="240"/>
    <rect x="1096" y="220" width="36" height="280"/>
    <rect x="1138" y="290" width="44" height="210"/>
    <rect x="1188" y="180" width="38" height="320"/>
    <polygon points="1188,180 1226,180 1207,140"/>
  </g>

  <!-- One International Place-esque twin -->
  <g fill="currentColor" opacity="0.55">
    <rect x="1240" y="240" width="34" height="260"/>
    <rect x="1240" y="240" width="34" height="16"/>
  </g>

  <!-- baseline -->
  <line x1="0" y1="500" x2="1600" y2="500" stroke="currentColor" stroke-width="1" opacity="0.3"/>
</svg>
